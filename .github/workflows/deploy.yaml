name: Deploy Stack
description: Deploy the CloudFormation stack

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/deploy.yaml'
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  CFN_TEMPLATES_S3_BUCKET: ${{ vars.CFN_TEMPLATES_S3_BUCKET }}
  STACK_NAME: ${{ github.event.repository.name }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  OIDC_ROLE_NAME: ${{ vars.OIDC_ROLE_NAME }}
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

permissions:
  id-token: write
  contents: read

jobs:
  cfn-deploy:
    name: Deploy Stack
    runs-on: ubuntu-latest
    environment: devl
    steps:
      # - name: Show Subject Pattern
      #   run: |
      #     echo "Repository: ${{ github.repository }}"
      #     echo "Expected subject pattern: repo:${{ github.repository }}:*"
        
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.OIDC_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Credentials
        run: |
          echo "✅ Successfully configured AWS credentials"
          aws sts get-caller-identity

      - name: Upload template to S3
        run: |
          TEMPLATE_KEY="${{ github.event.repository.name }}/template.yaml"
          aws s3 cp infra/template.yaml "s3://${{ env.CFN_TEMPLATES_S3_BUCKET }}/${TEMPLATE_KEY}"
          echo "TEMPLATE_KEY=${TEMPLATE_KEY}" >> $GITHUB_ENV
          echo "✓ Template uploaded to S3"

      - name: Build S3 template URL
        run: |
          TEMPLATE_URL="https://${{ env.CFN_TEMPLATES_S3_BUCKET }}.s3.${{ env.AWS_REGION }}.amazonaws.com/${{ env.TEMPLATE_KEY }}"
          echo "TEMPLATE_URL=${TEMPLATE_URL}" >> $GITHUB_ENV
          echo "Template URL: ${TEMPLATE_URL}"

      - name: Deploy CloudFormation stack
        run: |
          echo "Stack name: ${{ env.STACK_NAME }}"
          echo "Region: ${{ env.AWS_REGION }}"
          echo "Template URL: ${{ env.TEMPLATE_URL }}"

          # Check if stack exists
          STACK_EXISTS=$(aws cloudformation describe-stacks --stack-name "${{ env.STACK_NAME }}" --region "${{ env.AWS_REGION }}" 2>&1 || echo "")

          if echo "$STACK_EXISTS" | grep -q "does not exist"; then
            echo "Creating new stack..."
            if [ -f infra/parameters.json ] && [ -s infra/parameters.json ] && [ "$(cat infra/parameters.json)" != "{}" ]; then
              aws cloudformation create-stack --template-url "${{ env.TEMPLATE_URL }}" --stack-name "${{ env.STACK_NAME }}" --region "${{ env.AWS_REGION }}" --parameters file://./infra/parameters.json --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND
            else
              aws cloudformation create-stack --template-url "${{ env.TEMPLATE_URL }}" --stack-name "${{ env.STACK_NAME }}" --region "${{ env.AWS_REGION }}" --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND
            fi
          else
            echo "Updating existing stack..."
            if [ -f infra/parameters.json ] && [ -s infra/parameters.json ] && [ "$(cat infra/parameters.json)" != "{}" ]; then
              aws cloudformation update-stack --template-url "${{ env.TEMPLATE_URL }}" --stack-name "${{ env.STACK_NAME }}" --region "${{ env.AWS_REGION }}" --parameters file://./infra/parameters.json --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND || true
            else
              aws cloudformation update-stack --template-url "${{ env.TEMPLATE_URL }}" --stack-name "${{ env.STACK_NAME }}" --region "${{ env.AWS_REGION }}" --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND || true
            fi
          fi
          echo "✓ Stack deployment completed"

